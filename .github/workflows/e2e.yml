name: Testi

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  preverjanje:
    name: Tipi in enotski testi
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bunx prisma generate
      - run: bun run typecheck
      - run: bun run test

  e2e:
    name: Funkcionalni testi (Playwright)
    needs: preverjanje
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bunx prisma generate
      - name: Namesti brskalnik Chromium
        run: bunx playwright install --with-deps chromium
      - name: Zaženi funkcionalne teste
        run: bun run test:e2e
        env:
          CI: "true"

      - name: Shrani poročilo Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - name: Shrani posnetke, sledi in surove rezultate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14
      - name: Objavi rezultate JUnit
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Rezultati funkcionalnih testov
          path: test-results/junit.xml
          reporter: java-junit
          fail-on-error: false
